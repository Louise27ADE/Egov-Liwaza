name: CI — Tests et Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1 : Tests backend Python
  test-backend:
    name: Tests Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # Job 2 : Build frontend React
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: |
          cd frontend
          npm ci

      - name: Build de production
        run: |
          cd frontend
          npm run build
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_MCP_URL: ${{ secrets.VITE_MCP_URL }}

  # Job 3 : Build Docker (vérifie que les images se construisent)
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build image backend
        run: docker build -t egov-backend ./backend

      - name: Build image frontend
        run: docker build -t egov-frontend ./frontend
