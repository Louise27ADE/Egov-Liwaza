name: CI - Tests et Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1 : Tests backend Python
  test-backend:
    name: Tests Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dependances
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          cd backend
          export PYTHONPATH=.
          python -m pytest tests/test_fiscal_tools.py -v --tb=short

  # Job 2 : Build frontend React
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: |
          cd frontend
          npm ci

      - name: Build de production
        run: |
          cd frontend
          npm run build
        env:
          VITE_BACKEND_URL: https://louisehuggingface-egov-liwaza-backend.hf.space
